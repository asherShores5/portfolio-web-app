# Monthly, grouped: one PR per ecosystem/directory with minor and patch updates, so fixes arrive
# without noise. Major versions are upgrades to do on purpose, not via a bot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: npm
    directory: /portfolio
    schedule: { interval: monthly }
    groups: { web: { patterns: ["*"] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /infra
    schedule: { interval: monthly }
    groups: { infra: { patterns: ["*"] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
    open-pull-requests-limit: 2
