name: CI

# Tests on every PR and every push to main. Branch protection on main requires both jobs
# (`test`, `infra-test`). Amplify builds and hosts the site itself; the contact backend deploys
# from deploy-backend.yml. Setup: docs/first-deploy.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs: a moved tag can't change what runs in this repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: portfolio/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  infra-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      AWS_REGION: us-west-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: infra/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # No credentials here: the stacks synth env-agnostic (no lookups).
      - run: npx cdk synth --quiet
