version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - cd portfolio
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: portfolio/build
    files:
      - "**/*"
  cache:
    paths:
      - portfolio/node_modules/**/*
